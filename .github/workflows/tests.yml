name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php: '8.2'
            symfony: '7.4.*'
          - php: '8.4'
            symfony: '7.4.*'
          - php: '8.4'
            symfony: '8.0.*'
          - php: '8.4'
            symfony: '8.1.*'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: php tests/compatibility/configure.php '${{ matrix.symfony }}'
      - run: composer update --no-interaction --prefer-dist
      - run: composer test
      - run: npm ci
      - run: npm test
      - run: npm run build:prod
